[project]
name = "songchro"
description = "Synchronize playlists between iTunes and Plex"
authors = [
    { name = "Adam Brown", email = "acourtneybrown@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "click (==8.5.1)",
    "plexapi (==4.18.3)",
    "requests (==2.34.2)",
    "spotipy (==2.26.0)",
    "structlog (==26.1.0)",
    "pyyaml (==6.0.3)",
    "mutagen (==1.48.1)",
    "multimethod (==2.1)",
    "simpleeval (==1.0.8)",
    "py-applescript (==1.0.3); sys_platform == 'darwin'",
]
packages = [
    { include = "songchro", from = "src" },
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NotCharlie/songchro"
Repository = "https://github.com/NotCharlie/songchro"

[dependency-groups]
test = [
    "pytest (==9.2.0)",
]

[build-system]
requires = ["poetry-core==2.5.1", "poetry-dynamic-versioning==1.10.1"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
version = "0.0.0"

[tool.poetry.scripts]
songchro = "songchro.cli:cli"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = "==1.10.1", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
pattern = '(?P<base>\d+\.\d+\.\d+)'
dirty = true

[tool.poetry-dynamic-versioning.substitution]
files = ["src/songchro/__init__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
